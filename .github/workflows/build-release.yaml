name: Build & Release

# Jalankan manual dari tab "Actions" di GitHub, masukin nomor versi.
# Workflow ini akan:
#   1. Buat tag git (vX.Y.Z) + GitHub Release
#   2. Build Android (.apk)
#   3. Build Windows (installer .exe via Inno Setup)
#   4. Build Linux (.AppImage)
#   5. Upload ketiga hasil build ke Release yang sama

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nomor versi (contoh: 1.2.3, TANPA awalan v)"
        required: true
        type: string
      release_notes:
        description: "Catatan rilis (opsional)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Tandai sebagai pre-release?"
        required: false
        type: boolean
        default: false

env:
  FLUTTER_CHANNEL: "stable"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # 1) Buat tag + GitHub Release kosong (nanti diisi tiap build)
  # ---------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Set tag name
        id: vars
        run: echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Multi WhatsApp Web ${{ steps.vars.outputs.tag }}"
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          generate_release_notes: true

  # ---------------------------------------------------------------
  # 2) Android (.apk)
  # ---------------------------------------------------------------
  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      # GitHub Actions tidak mengizinkan context `secrets` dipakai langsung
      # di dalam `if:` step, jadi nilainya dititipkan lewat env job dulu.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Decode signing keystore (kalau secrets sudah diisi)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/mww-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=mww-keystore.jks
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release `
            --build-name=${{ inputs.version }} `
            --build-number=${{ github.run_number }} `
            --obfuscate `
            --split-debug-info=./log_info `
            --no-tree-shake-icons

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/multi_whatsapp_web_${{ inputs.version }}.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: out/multi_whatsapp_web_${{ inputs.version }}.apk

  # ---------------------------------------------------------------
  # 3) Windows (installer .exe via Inno Setup)
  # ---------------------------------------------------------------
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build Windows app
        run: |
          flutter build windows --release `
            --build-name=${{ inputs.version }} `
            --build-number=${{ github.run_number }} `
            --obfuscate `
            --split-debug-info=build\windows\log_info `
            --no-tree-shake-icons

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "compiler\inno_setup_mww.iss"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: compiler/Output/*.exe

  # ---------------------------------------------------------------
  # 4) Linux (.AppImage)
  # ---------------------------------------------------------------
  build-linux:
    needs: create-release
    # Sengaja PIN ke 22.04, bukan ubuntu-latest.
    # ubuntu-latest saat ini mengarah ke Ubuntu 24.04 (glibc 2.39+), sehingga
    # binary yang dihasilkan butuh glibc lebih baru dari yang tersedia di
    # banyak mesin pengguna (termasuk mesin dev lokal yang glibc-nya lebih
    # lama). AppImage TIDAK membundel glibc — ia tetap bergantung pada glibc
    # host saat dijalankan. Build di 22.04 (glibc 2.35) jauh lebih kompatibel
    # ke belakang. Kalau nanti perlu naik, naikkan sengaja & uji dulu, jangan
    # biarkan "latest" naik versi diam-diam di baliknya.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2 \
            libwebkit2gtk-4.1-dev libsecret-1-dev libjsoncpp-dev

      # FIX (build error: "unknown warning option
      # '-Wno-deprecated-literal-operator'" dengan -Werror aktif):
      # Percobaan pertama (install Clang 17 dari LLVM lalu set CC/CXX)
      # ternyata tidak mempan — error yang sama persis masih muncul,
      # yang berarti Flutter/CMake tidak benar-benar memakai compiler
      # yang ditunjuk lewat CC/CXX di sini (entah karena llvm.sh gagal
      # diam-diam di runner, atau toolchain Flutter memilih compiler
      # dengan caranya sendiri).
      #
      # Pendekatan yang lebih robust: TIDAK bergantung pada compiler
      # mana yang dipakai sama sekali. Cukup turunkan
      # "unknown-warning-option" dari error kembali jadi warning biasa
      # lewat CXXFLAGS/CFLAGS — compiler apa pun yang dipakai Flutter
      # akan tetap menerima flag -Wno-deprecated-literal-operator (dan
      # sejenisnya) sebagai warning yang diabaikan, bukan gagal build,
      # walau compiler itu tidak mengenali nama flag-nya.
      - name: Downgrade unknown-warning-option dari error jadi warning
        run: |
          echo "CXXFLAGS=-Wno-error=unknown-warning-option" >> "$GITHUB_ENV"
          echo "CFLAGS=-Wno-error=unknown-warning-option" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build AppImage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: "*.AppImage"

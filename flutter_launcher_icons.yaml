
flutter_launcher_icons:
  image_path: "assets/icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "assets/background.png"
  adaptive_icon_foreground: "assets/foreground.png"
  # adaptive_icon_foreground_inset: 16   # aktifkan cuma kalau foreground masih terasa mepet ke tepi setelah dites di HP

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0FA05A"
    theme_color: "#0FA05A"

  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon.png"
name: multi_whatsapp_web
description: >
  Multi WhatsApp Web — aplikasi cross-platform (Windows, macOS, Linux,
  Android, iOS) untuk mengelola beberapa sesi WhatsApp Web yang terisolasi.
  Dibangun mengikuti PRD v1.1 (Clean Architecture + BLoC, domain layer
  platform-agnostic).
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  get_it: ^7.7.0
  injectable: ^2.4.1

  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # PINNED (bukan ^10.x/^11.x): flutter_secure_storage_windows melompat ke
  # win32 ^6.0.1 mulai versi 10.1.0, yang bentrok dengan launch_at_startup
  # (win32_registry ^2.0.0 -> win32 ^5.8.0). 9.2.4 adalah rilis stabil
  # terakhir sebelum seri 10.x, jadi seluruh masalah win32 ini tidak relevan
  # di rentang ini.
  flutter_secure_storage: ^9.2.4

  webview_windows: 
    path: ../flutter-webview-windows
  #   # git:
  #   #   url: https://github.com/Bellukchips/flutter-webview-windows.git
  #   #   ref: main
  # Dipakai HANYA untuk Android/iOS (lihat MobileWebViewSessionHandle).
  # Sengaja dikunci ke versi stabil TANPA implementasi Linux, supaya
  # `flutter create --platforms=...,linux` tidak menyertakan
  # flutter_inappwebview_linux (yang butuh WPE WebKit).
  # flutter_inappwebview: ^6.1.5

  # NOTE on Linux: no embedded-webview dependency here. An earlier pass
  # tried package:webview_cef, but that package runs ONE global CEF
  # process with a single shared cookie/localStorage store — two
  # "accounts" both hitting web.whatsapp.com under that one store look
  # like the SAME browser tab to WhatsApp Web, which is exactly what
  # produced the "Gunakan WhatsApp di sini" conflict prompt when testing
  # 2 accounts. There's no per-instance profile/user-data-dir exposed to
  # fix that. See linux_webview_adapter.dart: Linux instead launches each
  # account as a separate system Chromium/Chrome process with its own
  # --user-data-dir, using only dart:io (no extra package needed) — that
  # gives genuine, OS-level per-account cookie/localStorage isolation.
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2
  crypto: ^3.0.6
#  webview_flutter: ^4.10.0
  # PINNED (bukan ^13.x/^14.x): rentang ini masih di bawah lompatan win32
  # ke ^6.0.0 yang terjadi di rilis-rilis mayor device_info_plus yang lebih
  # baru, yang akan bentrok dengan win32_registry ^2.0.0 milik
  # launch_at_startup.
  device_info_plus: ^10.1.2

  # PINNED (bukan ^9.x/^10.x): sama seperti device_info_plus di atas —
  # package_info_plus 10.0.0 menaikkan win32 ke ^6.0.1. 8.0.2 aman.
  # package_info_plus: ^8.0.2

  # connectivity_plus: ^7.0.0

  # tray_manager: ^0.2.3
  # window_manager: ^0.3.9

  # PINNED (bukan ^0.4.x/^0.5.x): launch_at_startup masih terkunci ke
  # win32_registry ^2.0.0 -> win32 ^5.8.0 di semua versinya sampai saat ini.
  # Menaikkan versi package lain di atas ke seri yang butuh win32 ^6.0.0
  # akan langsung bentrok dengan constraint ini.
  launch_at_startup: ^0.3.1

  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  build_runner: ^2.4.11
  isar_community_generator: ^3.3.2

  # PINNED (bukan ^3.x): injectable_generator >=3.1.3 butuh analyzer
  # >=11.0.0 (lewat dependensi lean_builder-nya), sementara
  # isar_community_generator ^3.3.2 mengunci analyzer <11.0.0. Tidak ada
  # versi 3.x yang cocok dengan keduanya sekaligus. 2.6.1 adalah generator
  # line yang sezaman dengan injectable ^2.4.1 di atas dan tidak punya
  # syarat analyzer setinggi itu.
  injectable_generator: ^2.6.1

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/

    
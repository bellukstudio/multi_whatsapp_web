name: multi_whatsapp_web
description: >
  Multi WhatsApp Web — aplikasi cross-platform (Windows, macOS, Linux,
  Android, iOS) untuk mengelola beberapa sesi WhatsApp Web yang terisolasi.
  Dibangun mengikuti PRD v1.1 (Clean Architecture + BLoC, domain layer
  platform-agnostic).
publish_to: "none"
version: 1.0.12

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  get_it: ^7.7.0
  injectable: ^2.4.1
  firebase_core: ^4.14.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  flutter_secure_storage: ^9.2.4

  webview_windows:
    git:
      url: https://github.com/Bellukchips/flutter-webview-windows.git
      ref: main

  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2
  crypto: ^3.0.6

  device_info_plus: ^10.1.2

  package_info_plus: ^8.0.2

  url_launcher: ^6.3.1

  launch_at_startup: ^0.3.1

  logger: ^2.4.0
  firebase_messaging: ^16.6.0
  cloud_firestore: ^6.9.0
  firedart: ^0.9.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  build_runner: ^2.4.11
  isar_community_generator: ^3.3.2

  injectable_generator: ^2.6.1

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
